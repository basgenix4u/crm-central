spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  cache:
    type: simple

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      enabled: true

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:default-secret-key-that-should-be-changed-in-production-at-least-256-bits}
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
  default-page-size: 20
  max-page-size: 100

file:
  upload-dir: /tmp/uploads

logging:
  level:
    root: WARN
    com.crmcentral: INFO
