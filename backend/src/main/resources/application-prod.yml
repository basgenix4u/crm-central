spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  # Disable Redis on free tier (use simple cache)
  data:
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:6379}

  cache:
    type: ${CACHE_TYPE:simple}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBjcm0gY2VudHJhbCBhcHBsaWNhdGlvbiB0aGF0IG5lZWRzIHRvIGJlIGF0IGxlYXN0IDI1NiBiaXRz}
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
  default-page-size: 20
  max-page-size: 100

file:
  upload-dir: ${FILE_UPLOAD_DIR:/tmp/uploads}

logging:
  level:
    com.crmcentral: INFO
    org.hibernate.SQL: WARN
